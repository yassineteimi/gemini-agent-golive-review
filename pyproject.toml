[project]
name = "banque-ardoise-agent"
version = "0.1.0"
description = "Phase 0 ADK agent for the Banque Ardoise go-live review (stub model, offline)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk==2.15.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
